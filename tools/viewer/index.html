<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Viewer</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <h1 id="page-title">Asset Viewer</h1>
        <div id="game-select-row">
          <label>Game
            <select id="game-select"></select>
          </label>
          <label>Platform
            <select id="platform-select"></select>
          </label>
        </div>
        <div id="tabs" role="tablist">
          <button id="tab-assets" class="tab-btn active" type="button" role="tab" aria-selected="true">Assets</button>
          <button id="tab-data" class="tab-btn" type="button" role="tab" aria-selected="false">Data</button>
        </div>
        <input id="search" type="text" placeholder="Search assets…" />
        <input id="data-search" type="text" placeholder="Search tables…" class="hidden" />
      </div>
      <div id="asset-sidebar">
        <div id="list-meta"></div>
        <div id="list"></div>
      </div>
      <div id="data-sidebar" class="hidden">
        <div id="data-list-meta"></div>
        <div id="data-list"></div>
      </div>
    </div>
    <div id="main">
      <div id="asset-view">
        <div id="toolbar">
          <span id="title">No asset selected</span>
          <span id="meta"></span>
          <span id="frame-info"></span>
          <label>Zoom
            <select id="zoom">
              <option value="1">1×</option>
              <option value="2">2×</option>
              <option value="3" selected>3×</option>
              <option value="4">4×</option>
              <option value="6">6×</option>
              <option value="8">8×</option>
            </select>
          </label>
          <label>Background
            <select id="bg">
              <option value="checker" selected>Checkered</option>
              <option value="black">Black</option>
              <option value="white">White</option>
            </select>
          </label>
          <div id="sprite-display" class="settings-anchor">
            <button id="sprite-display-toggle" type="button" title="Display profile, colour grading, and export">🎨 Display</button>
            <div id="sprite-display-panel" class="hidden">
              <label>Display profile
                <select id="display-profile">
                  <option value="none" selected>None</option>
                  <option value="crt-shadow-mask">CRT (shadow mask)</option>
                  <option value="crt-aperture-grille">CRT (aperture grille)</option>
                  <option value="crt-slot-mask">CRT (slot mask)</option>
                  <option value="lcd-subpixel">LCD (subpixel)</option>
                </select>
              </label>
              <label>Scanlines <input id="display-scanline" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
              <label>Mask intensity <input id="display-mask" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
              <label>Curvature <input id="display-curvature" type="range" min="0" max="1" step="0.01" value="0" /></label>
              <label>Vignette <input id="display-vignette" type="range" min="0" max="1" step="0.01" value="0.15" /></label>
              <label>Glow <input id="display-glow" type="range" min="0" max="1" step="0.01" value="0.2" /></label>
              <label>Chromatic aberration <input id="display-chromatic" type="range" min="0" max="1" step="0.01" value="0" /></label>
              <label>Brightness <input id="grading-brightness" type="range" min="0.5" max="1.5" step="0.01" value="1" /></label>
              <label>Contrast <input id="grading-contrast" type="range" min="0.5" max="1.5" step="0.01" value="1" /></label>
              <label>Saturation <input id="grading-saturate" type="range" min="0" max="2" step="0.01" value="1" /></label>
              <label>Hue rotate <input id="grading-hue" type="range" min="-180" max="180" step="1" value="0" /></label>
              <button id="grading-reset" type="button">Reset grading</button>
              <button id="sprite-screenshot" type="button" title="Download a watermarked PNG screenshot">📷 Screenshot</button>
              <button id="sprite-record" type="button" title="Record a watermarked clip of the sprite animation">⏺ Record</button>
            </div>
          </div>
        </div>
        <div id="canvas-wrap"></div>
        <div id="map-strip" class="hidden">
          <div class="map-strip-row">
            <label><input id="map-layer-terrain" type="checkbox" checked /> Terrain</label>
            <label><input id="map-layer-pois" type="checkbox" checked /> POIs</label>
            <label><input id="map-layer-labels" type="checkbox" checked /> Labels</label>
            <label><input id="map-layer-sections" type="checkbox" /> Sections</label>
            <label id="map-p3-skin-label" class="hidden" title="Phantasie I/II's own terrain byte has no bundled art (P1/P2) or only flat fill patterns (P2, once decoded) — this re-skins each terrain class with a similarly-named Phantasie III tile as a fun approximation, not a claim about what the original game looked like."><input id="map-p3-skin" type="checkbox" /> Phantasie III art</label>
            <button id="map-fit" type="button">Fit</button>
            <span id="map-coord"></span>
          </div>
          <div class="map-strip-row">
            <span id="map-legend-note" class="map-strip-note" title="Phantasie I/II's terrain byte is not a graphics index, so the legend swatches are placeholder colours per terrain class. Phantasie III's byte IS a tile index into artwork bundled in phantasy.set, so its swatches are sampled from the real tiles.">Terrain class (placeholder colours):</span>
            <span id="map-legend"></span>
          </div>
          <div id="map-detail"></div>
        </div>
        <div id="dungeon-strip" class="hidden">
          <div class="map-strip-row">
            <span class="map-strip-note">Cell classes (dungeon-format.md §4):</span>
            <span id="dungeon-legend"></span>
          </div>
          <div id="dungeon-detail"></div>
        </div>
        <div id="music-strip" class="hidden">
          <div class="music-strip-row">
            <button id="music-play" type="button" data-state="stopped">▶ Play</button>
            <button id="music-stop" type="button" disabled>■ Stop</button>
            <label><input id="music-loop" type="checkbox" /> Loop</label>
            <label title="The game is confirmed NTSC-tuned (dungeon-format.md §9.0.2.1) — this simulates the tick rate and Paula clock of a real PAL Amiga instead, which plays ~20% slower and very slightly lower-pitched. A &quot;what if&quot; playback option, not a claim about what SSI shipped.">Region
              <select id="music-region">
                <option value="ntsc" selected>60 Hz (NTSC)</option>
                <option value="pal">50 Hz (PAL)</option>
              </select>
            </label>
            <span id="music-tracks"></span>
            <span id="music-time">0:00 / 0:00</span>
          </div>
          <div id="music-detail"></div>
        </div>
        <div id="frame-strip" class="hidden">
          <button id="play-toggle" type="button" title="Play/pause animation">▶</button>
          <input id="frame-slider" type="range" min="0" max="0" value="0" />
          <span id="frame-label">Sprite 0 / 0</span>
        </div>
        <div id="palette-bar" class="hidden"></div>
      </div>
      <div id="data-view" class="hidden">
        <div id="data-toolbar">
          <span id="data-title">No table selected</span>
          <span id="data-meta"></span>
          <input id="data-row-search" type="text" placeholder="Filter rows…" />
        </div>
        <div id="data-table-wrap"></div>
      </div>
    </div>
  </div>
  <script type="module" src="viewer.ts"></script>
</body>
</html>
