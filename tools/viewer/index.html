<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Viewer</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <h1 id="page-title">Asset Viewer</h1>
        <div id="game-select-row">
          <label>Game
            <select id="game-select"></select>
          </label>
          <label>Platform
            <select id="platform-select"></select>
          </label>
        </div>
        <input id="search" type="text" placeholder="Search assets…" />
      </div>
      <div id="list-meta"></div>
      <div id="list"></div>
    </div>
    <div id="main">
      <div id="toolbar">
        <span id="title">No asset selected</span>
        <span id="meta"></span>
        <span id="frame-info"></span>
        <label>Zoom
          <select id="zoom">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="3" selected>3×</option>
            <option value="4">4×</option>
            <option value="6">6×</option>
            <option value="8">8×</option>
          </select>
        </label>
        <label>Background
          <select id="bg">
            <option value="checker" selected>Checkered</option>
            <option value="black">Black</option>
            <option value="white">White</option>
          </select>
        </label>
      </div>
      <div id="canvas-wrap"></div>
      <div id="map-strip" class="hidden">
        <div class="map-strip-row">
          <label><input id="map-layer-terrain" type="checkbox" checked /> Terrain</label>
          <label><input id="map-layer-pois" type="checkbox" checked /> POIs</label>
          <label><input id="map-layer-labels" type="checkbox" checked /> Labels</label>
          <label><input id="map-layer-sections" type="checkbox" /> Sections</label>
          <label id="map-p3-skin-label" class="hidden" title="Phantasie I/II's own terrain byte has no bundled art (P1/P2) or only flat fill patterns (P2, once decoded) — this re-skins each terrain class with a similarly-named Phantasie III tile as a fun approximation, not a claim about what the original game looked like."><input id="map-p3-skin" type="checkbox" /> Phantasie III art</label>
          <button id="map-fit" type="button">Fit</button>
          <span id="map-coord"></span>
        </div>
        <div class="map-strip-row">
          <span id="map-legend-note" class="map-strip-note" title="Phantasie I/II's terrain byte is not a graphics index, so the legend swatches are placeholder colours per terrain class. Phantasie III's byte IS a tile index into artwork bundled in phantasy.set, so its swatches are sampled from the real tiles.">Terrain class (placeholder colours):</span>
          <span id="map-legend"></span>
        </div>
        <div id="map-detail"></div>
      </div>
      <div id="music-strip" class="hidden">
        <div class="music-strip-row">
          <button id="music-play" type="button" data-state="stopped">▶ Play</button>
          <button id="music-stop" type="button" disabled>■ Stop</button>
          <label><input id="music-loop" type="checkbox" /> Loop</label>
          <label title="The game is confirmed NTSC-tuned (dungeon-format.md §9.0.2.1) — this simulates the tick rate and Paula clock of a real PAL Amiga instead, which plays ~20% slower and very slightly lower-pitched. A &quot;what if&quot; playback option, not a claim about what SSI shipped.">Region
            <select id="music-region">
              <option value="ntsc" selected>60 Hz (NTSC)</option>
              <option value="pal">50 Hz (PAL)</option>
            </select>
          </label>
          <span id="music-tracks"></span>
          <span id="music-time">0:00 / 0:00</span>
        </div>
        <div id="music-detail"></div>
      </div>
      <div id="frame-strip" class="hidden">
        <input id="frame-slider" type="range" min="0" max="0" value="0" />
        <span id="frame-label">Sprite 0 / 0</span>
      </div>
      <div id="palette-bar" class="hidden"></div>
    </div>
  </div>
  <script type="module" src="viewer.ts"></script>
</body>
</html>
